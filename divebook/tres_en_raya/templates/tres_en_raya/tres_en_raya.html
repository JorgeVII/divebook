{% extends 'base.html' %}

{% block title %}Scuba Doo - Tres en raya{% endblock %}

{% block content %}
    <h1>Tres en raya</h1>
    <p class="game-message">{{ mensaje }}</p>

    <form class="board" action="{% url 'tres_en_raya:play' %}" method="post">
        {% csrf_token %}
        {% comment %} <input type="hidden" name="tablero" value="{{ tablero }}">
        <input type="hidden" name="turno" value="{{ turno }}"> {% endcomment %}
        {% for casilla in tablero %}
            <button type="submit" name="posicion" value="{{ forloop.counter0 }}"
                    class="cell{% if casilla == 'X' %} cell-x{% elif casilla == 'O' %} cell-o{% endif %}"
                    {% if terminado or casilla != '-' %}disabled{% endif %}>
                {% if casilla != '-' %}{{ casilla }}{% endif %}
            </button>
        {% endfor %}
    </form>

    {% if terminado %}
        <p><a class="new-game" href="{% url 'tres_en_raya:play' %}">Nueva partida</a></p>
    {% endif %}
{% endblock %}
